[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kapibala"
version = "0.1.0"
description = "获客初筛 Agent：多维用户状态估计与安全动作执行"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=1.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
kapibala = "kapibala.web:main"
kapibala-cli = "kapibala.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kapibala = ["static/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
